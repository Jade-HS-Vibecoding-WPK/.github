name: Straße aktualisieren

# Holt alle öffentlichen Repos der Organisation, aktualisiert die Projekttabelle
# im Org-Profil (profile/README.md + profile/street.svg) und veröffentlicht die
# 3D-Straße aus site/ auf GitHub Pages.

on:
  schedule:
    - cron: '*/20 5-21 * * *'   # alle 20 Minuten, 6–23 Uhr deutscher Zeit
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'street.config.json'
      - '.github/workflows/strasse.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: strasse
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Projekte einsammeln
        id: build
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Profil-README und Banner committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md profile/street.svg
          if ! git diff --cached --quiet; then
            git commit -m "Projektliste aktualisiert"
            git push
          fi

      - name: Pages vorbereiten
        if: steps.build.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - name: Cache-Busting (Pages cacht Dateien 10 Minuten)
        if: steps.build.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s|src=\"street.js\"|src=\"street.js?v=$v\"|; s|href=\"style.css\"|href=\"style.css?v=$v\"|" site/index.html
          sed -i "s|'./house.mjs'|'./house.mjs?v=$v'|" site/street.js
          grep -c "?v=$v" site/index.html site/street.js

      - name: Seite hochladen
        if: steps.build.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Veröffentlichen
        id: deploy
        if: steps.build.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
